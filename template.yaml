AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless Event Registration and Ticketing System

Parameters:
  FrontendPriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        REGISTRATIONS_TABLE: !Ref RegistrationsTable
    LoggingConfig:
      LogFormat: JSON

Resources:
  EventApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: registrationId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: registrationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ListEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/list_events/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        ListEvents:
          Type: Api
          Properties:
            RestApiId: !Ref EventApi
            Path: /events
            Method: get

  RegisterAttendeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/register_attendee/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable
      Events:
        Register:
          Type: Api
          Properties:
            RestApiId: !Ref EventApi
            Path: /register
            Method: post

  GetRegistrationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get_registrations/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RegistrationsTable
      Events:
        GetRegistrations:
          Type: Api
          Properties:
            RestApiId: !Ref EventApi
            Path: /registrations/{email}
            Method: get

  CancelRegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/cancel_registration/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable
      Events:
        CancelRegistration:
          Type: Api
          Properties:
            RestApiId: !Ref EventApi
            Path: /registration/{id}
            Method: delete

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: !Ref FrontendPriceClass
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-event-ticketing"
      DashboardBody: !Sub |
        {"widgets":[{"type":"metric","properties":{"title":"Registration Lambda","view":"timeSeries","region":"${AWS::Region}","metrics":[["AWS/Lambda","Errors","FunctionName","${RegisterAttendeeFunction}"],[".","Duration","FunctionName","${RegisterAttendeeFunction}"]],"period":300,"stat":"Sum"}},{"type":"metric","properties":{"title":"API Gateway 5XX","view":"timeSeries","region":"${AWS::Region}","metrics":[["AWS/ApiGateway","5XXError","ApiName","${EventApi}"]],"period":300,"stat":"Sum"}}]}

  RegistrationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Registration Lambda errors detected
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RegisterAttendeeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RegistrationDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Registration Lambda is taking too long
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref RegisterAttendeeFunction
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Gateway returned 5XX errors
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Ref EventApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${EventApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod"
  EventsEndpoint:
    Value: !Sub "https://${EventApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/events"
  RegisterEndpoint:
    Value: !Sub "https://${EventApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/register"
  RegistrationsEndpoint:
    Value: !Sub "https://${EventApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/registrations/{email}"
  CancelRegistrationEndpoint:
    Value: !Sub "https://${EventApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/registration/{id}"
  EventsTableName:
    Value: !Ref EventsTable
  RegistrationsTableName:
    Value: !Ref RegistrationsTable
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
