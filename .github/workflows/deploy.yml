name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || 'melview' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate SAM template
        run: sam validate --lint
      - name: Build application
        run: sam build
      - name: Deploy SAM stack
        run: sam deploy --stack-name "$STACK_NAME" --region "$AWS_REGION" --resolve-s3 --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset
      - name: Publish frontend and invalidate CDN
        shell: bash
        run: |
          FRONTEND_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" --output text)
          FRONTEND_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='FrontendUrl'].OutputValue" --output text)
          API_BASE_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" --output text)
          sed "s|PASTE_API_BASE_URL_HERE|$API_BASE_URL|g" frontend/app.js > /tmp/app.js
          aws s3 sync frontend/ "s3://$FRONTEND_BUCKET" --delete --exclude app.js
          aws s3 cp /tmp/app.js "s3://$FRONTEND_BUCKET/app.js" --content-type application/javascript
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
          echo "Frontend deployed to $FRONTEND_URL"
